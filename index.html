    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Comfortaa:wght@300;400;500;600;700&display=swap');
      
      body {
        font-family: 'Comfortaa', cursive;
      }
      
      h1, h2, h3, .mystic-font {
        font-family: 'Cinzel', serif;
      }

      /* Base Glass Panel - Light Mode */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(139, 92, 246, 0.2);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      
      /* Dark Mode Override */
      .dark .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }

      /* Site Footer Custom Styles */
      .site-footer {
        font-family: 'Comfortaa', cursive;
        margin-top: 4rem;
        font-size: 18px; /* Base font size for all footer content */
      }

      .gb-element-976bf953 {
        background-image: linear-gradient(359deg, #040713 0%, #581c87 100%);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        display: grid;
        grid-template-columns: 1fr;
        align-items: center; /* Vertically align grid items in the middle */
        margin-left: auto;
        margin-right: auto;
        border-top: 1px solid #581c87;
        padding: 40px 5% 40px 5%;
        gap: 3rem;
      }

      @media (min-width: 768px) {
        .gb-element-976bf953 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .gb-element-157df1c6 {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        text-align: center;
      }

      .gb-media-0d2fcba1 {
        max-width: 240px;
        height: auto;
      }

      .gb-text-5d87b161 {
        align-items: center;
        align-self: center;
        background-color: #fec878;
        color: #221547 !important;
        display: inline-flex;
        font-weight: 900;
        justify-content: center;
        justify-items: center;
        justify-self: center;
        text-align: center;
        text-decoration: none !important; /* Ensure the button stays without underline */
        transition: all 0.5s ease 0s;
        border-radius: 10px;
        padding: .5rem 1rem;
        font-family: 'Comfortaa', cursive;
        font-size: 18px;
      }

      .gb-text-5d87b161:hover {
        background-color: #fdbb5a;
        transform: translateY(-2px);
      }

      .site-footer a {
        color: #d8b4fe;
        transition: color 0.2s;
        font-size: 18px;
        text-decoration: underline; /* Added underline as requested */
      }

      .site-footer a:hover {
        color: #fec878;
      }

      .gb-element-689e68e2 {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .gb-text-0a42f6ba {
        color: #fff;
        font-size: 18px;
        margin-bottom: 0.5rem;
      }

      .gb-text-c2a84fe9, .gb-text-426684f0 {
        margin-bottom: 0.25rem;
        font-size: 18px;
      }

      .gb-element-0b42c32e {
        display: flex;
        align-items: center; /* Ensure contents inside the column are centered vertically */
        height: 100%;
      }

      .gb-element-0b42c32e p {
        color: #d8b4fe;
        font-size: 13px; /* Specific font size for disclaimer */
        line-height: 1.6;
        font-style: italic;
        text-align: center; /* Centered on mobile */
      }

      @media (min-width: 768px) {
        /* Keep first two columns centered */
        .gb-element-157df1c6, .gb-element-689e68e2 {
          text-align: center;
          align-items: center;
          justify-content: center;
        }
        /* Keep third column paragraph left-aligned on desktop */
        .gb-element-0b42c32e p {
          text-align: left;
        }
      }

      .gb-element-25077e3f {
        background-color: #040713;
        padding: 20px 5%;
        text-align: center;
        font-size: 14px; /* Updated to 14px per request */
        color: #ffffff; /* Updated to white per request */
        border-top: 1px solid rgba(255,255,255,0.05);
      }

      .gb-text-44633b07 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-size: 14px; /* Updated to 14px per request */
      }

      .svg-inline--fa {

        display: inline-block;
